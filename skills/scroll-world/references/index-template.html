<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scroll World — Demopage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sw-font-display: 'Outfit', sans-serif;
      --sw-font-body: 'Inter', sans-serif;
    }
  </style>
</head>
<body>

  <!-- Mount target -->
  <div id="world"></div>

  <script src="references/scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'Diorama World', href: '#' },
      diveScroll: 1.4,
      connScroll: 0.9,
      hint: 'scroll to explore',
      nav: true,
      atmosphere: true,
      sections: [
        {
          id: 'farm', label: '01. Harvest',
          still: 'assets/farm.webp', clip: 'assets/vid/farm.mp4',
          accent: '#8FB98A', eyebrow: 'Origin Story', title: 'Crafted from the source.',
          body: 'Every journey begins in high altitude gardens, handpicked at dawn.',
          tags: ['Organic', 'Single Origin']
        },
        {
          id: 'kitchen', label: '02. Kitchen',
          still: 'assets/kitchen.webp', clip: 'assets/vid/kitchen.mp4',
          accent: '#C88A5A', eyebrow: 'Artisan Process', title: 'Slow brewed perfection.',
          body: 'Traditional copper cauldrons turn raw botanicals into liquid gold.',
          tags: ['Small Batch', 'Copper Distilled']
        },
        {
          id: 'shop', label: '03. Flagship',
          still: 'assets/shop.webp', clip: 'assets/vid/shop.mp4',
          accent: '#9B7EBD', eyebrow: 'Experience', title: 'Step into the atmosphere.',
          body: 'Designed as a sanctuary for taste, craft, and human connection.',
          tags: ['Flagship Store', 'Immersive']
        }
      ],
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4'
      ]
    });
  </script>
</body>
</html>
